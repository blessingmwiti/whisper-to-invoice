name: WhisperToInvoice
options:
  bundleIdPrefix: com.whispertoinvoice
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_NONNULL: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # The LiteRT-LM binary ships an arm64 simulator slice only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    LM_SKIP_METADATA_EXTRACTION: YES
    LM_SKIP_METADATA_EXTRACTION: YES

packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM.git
    exactVersion: 0.20.0

targets:
  WhisperToInvoice:
    type: application
    platform: iOS
    sources:
      - path: WhisperToInvoice
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    entitlements:
      path: WhisperToInvoice/Resources/WhisperToInvoice.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: WhisperToInvoice/Resources/Info.plist
      properties:
        CFBundleDisplayName: Whisper to Invoice
        CFBundleName: Whisper to Invoice
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Nunito-ExtraLight.ttf
          - Nunito-Light.ttf
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
        NSMicrophoneUsageDescription: Whisper to Invoice records your voice so the on-device AI model can turn a spoken sale into an invoice. Audio never leaves your device.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispertoinvoice.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WhisperToInvoice/Resources/Info.plist
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  WhisperToInvoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhisperToInvoiceTests
    dependencies:
      - target: WhisperToInvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispertoinvoice.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhisperToInvoice.app/WhisperToInvoice"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WhisperToInvoice:
    build:
      targets:
        WhisperToInvoice: all
        WhisperToInvoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhisperToInvoiceTests
    archive:
      config: Release
